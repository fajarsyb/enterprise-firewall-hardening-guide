<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1400" width="100%" height="100%" style="background-color: #0B132B; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818CF8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- TITLE -->
  <g transform="translate(80, 35)">
    <rect x="0" y="0" width="8" height="46" rx="4" fill="#38BDF8"/>
    <text x="24" y="32" fill="#F8FAFC" font-size="26" font-weight="bold">TOPOLOGI ARSITEKTUR IDEAL &amp; AMAN: 2-LAYER SPINE-LEAF CLOS FABRIC (MODERN DATACENTER)</text>
    <text x="24" y="56" fill="#94A3B8" font-size="13">East-West Latency Optimization | EVPN-VXLAN Overlay | Underlay ECMP Routing | Zero Spanning-Tree (STP)</text>
  </g>

  <!-- TIER 1: NORTH-SOUTH TRANSIT (BORDER LEAF & SERVICE CLUSTER) -->
  <g transform="translate(80, 110)" filter="url(#shadow)">
    <rect width="2240" height="210" rx="14" fill="#172033" stroke="#EF4444" stroke-width="2"/>
    <rect width="2240" height="32" rx="14" fill="#1F293D"/>
    <text x="25" y="22" fill="#FCA5A5" font-size="13" font-weight="bold">1. NORTH-SOUTH TRANSIT: BORDER LEAFS &amp; SECURITY SERVICES CLUSTER</text>

    <!-- WAN / Cloud Interconnect -->
    <g transform="translate(40, 50)">
      <path d="M 40 60 A 30 30 0 0 1 90 25 A 45 45 0 0 1 180 20 A 35 35 0 0 1 230 50 A 30 30 0 0 1 250 80 A 25 25 0 0 1 230 110 L 45 110 A 25 25 0 0 1 20 85 A 25 25 0 0 1 40 60 Z" fill="#0F2847" stroke="#38BDF8" stroke-width="2"/>
      <text x="135" y="65" fill="#BAE6FD" font-size="12" font-weight="bold" text-anchor="middle">WAN / MULTI-CLOUD</text>
      <text x="135" y="85" fill="#38BDF8" font-size="10.5" text-anchor="middle">ISPs &amp; Cloud Interconnect</text>
    </g>

    <!-- Border Leafs -->
    <rect x="360" y="55" width="460" height="120" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="380" y="82" fill="#FDE68A" font-size="13" font-weight="bold">Border Leaf Pair (01 &amp; 02)</text>
    <text x="380" y="104" fill="#F8FAFC" font-size="11">• eBGP Peering ke WAN &amp; Cloud Direct Connect</text>
    <text x="380" y="124" fill="#94A3B8" font-size="11">• Data Center Interconnect (DCI EVPN Gateway)</text>
    <text x="380" y="144" fill="#10B981" font-size="10.5">Terminates External L3 Routes into Fabric</text>

    <!-- Security Services Cluster -->
    <rect x="860" y="55" width="820" height="120" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="2"/>
    <text x="880" y="82" fill="#FCA5A5" font-size="13" font-weight="bold">Security Services Cluster (Firewall NGFW, WAF &amp; ADC Load Balancer)</text>
    <text x="880" y="104" fill="#F8FAFC" font-size="11">• Service-Chaining via VRF Inter-Tenant Transit (VRF-Web, VRF-App, VRF-DB)</text>
    <text x="880" y="124" fill="#F8FAFC" font-size="11">• Inspeksi Mendalam North-South &amp; Lintas-VRF East-West Traffic</text>
    <text x="880" y="144" fill="#FCA5A5" font-size="10.5">Mencegah Bypass: Seluruh trafik antar-tier wajib melewati cluster firewall ini</text>

    <!-- Telemetry & OOB -->
    <rect x="1720" y="55" width="480" height="120" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="1740" y="82" fill="#CFFAFE" font-size="12.5" font-weight="bold">Telemetry &amp; Out-of-Band Network</text>
    <text x="1740" y="104" fill="#94A3B8" font-size="11">• Dedicated Management Fabric Switches</text>
    <text x="1740" y="124" fill="#94A3B8" font-size="11">• Streaming Telemetry (gNMI) &amp; OpenConfig</text>
    <text x="1740" y="144" fill="#06B6D4" font-size="10.5">Syslog TLS ke SIEM, IPMI &amp; PDU Management</text>
  </g>

  <!-- TIER 2: SPINE LAYER -->
  <g transform="translate(80, 350)" filter="url(#shadow)">
    <rect width="2240" height="210" rx="14" fill="#172033" stroke="#818CF8" stroke-width="2"/>
    <rect width="2240" height="32" rx="14" fill="#1F293D"/>
    <text x="25" y="22" fill="#E0E7FF" font-size="13" font-weight="bold">2. SPINE LAYER (L3 ROUTING FABRIC UNDERLAY - EQUAL-COST MULTI-PATH / ZERO STP)</text>

    <rect x="40" y="55" width="500" height="125" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <text x="60" y="85" fill="#38BDF8" font-size="13" font-weight="bold">Spine Switch 01</text>
    <text x="60" y="107" fill="#F8FAFC" font-size="11">• 32x 100G/400G QSFP-DD Ports</text>
    <text x="60" y="127" fill="#94A3B8" font-size="11">• BGP EVPN Route Reflector (RR)</text>
    <text x="60" y="147" fill="#818CF8" font-size="10.5">Wire-Speed Non-Blocking Underlay</text>

    <rect x="590" y="55" width="500" height="125" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <text x="610" y="85" fill="#38BDF8" font-size="13" font-weight="bold">Spine Switch 02</text>
    <text x="610" y="107" fill="#F8FAFC" font-size="11">• 32x 100G/400G QSFP-DD Ports</text>
    <text x="610" y="127" fill="#94A3B8" font-size="11">• BGP EVPN Route Reflector (RR)</text>
    <text x="610" y="147" fill="#818CF8" font-size="10.5">Equal-Cost Multi-Path (ECMP Hash)</text>

    <rect x="1140" y="55" width="500" height="125" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <text x="1160" y="85" fill="#38BDF8" font-size="13" font-weight="bold">Spine Switch 03</text>
    <text x="1160" y="107" fill="#F8FAFC" font-size="11">• 32x 100G/400G QSFP-DD Ports</text>
    <text x="1160" y="127" fill="#94A3B8" font-size="11">• BGP EVPN Route Reflector (RR)</text>
    <text x="1160" y="147" fill="#818CF8" font-size="10.5">Zero Spanning Tree (Semua Link Aktif)</text>

    <rect x="1690" y="55" width="510" height="125" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <text x="1710" y="85" fill="#38BDF8" font-size="13" font-weight="bold">Spine Switch 04</text>
    <text x="1710" y="107" fill="#F8FAFC" font-size="11">• 32x 100G/400G QSFP-DD Ports</text>
    <text x="1710" y="127" fill="#94A3B8" font-size="11">• BGP EVPN Route Reflector (RR)</text>
    <text x="1710" y="147" fill="#818CF8" font-size="10.5">High-Availability Fabric Resilience</text>
  </g>

  <!-- TIER 3: LEAF LAYER -->
  <g transform="translate(80, 590)" filter="url(#shadow)">
    <rect width="2240" height="230" rx="14" fill="#172033" stroke="#10B981" stroke-width="2"/>
    <rect width="2240" height="32" rx="14" fill="#1F293D"/>
    <text x="25" y="22" fill="#D1FAE5" font-size="13" font-weight="bold">3. LEAF LAYER (TOP-OF-RACK VTEP ENDPOINTS &amp; DISTRIBUTED ANYCAST GATEWAY)</text>

    <rect x="35" y="55" width="515" height="145" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1.5"/>
    <text x="50" y="82" fill="#6EE7B7" font-size="12" font-weight="bold">Leaf 01 &amp; 02 (Rack A: Web Tier)</text>
    <text x="50" y="104" fill="#F8FAFC" font-size="10.5">• 48x 25G SFP28 + 6x 100G Uplinks</text>
    <text x="50" y="122" fill="#38BDF8" font-size="10.5">• VTEP 10.10.200.1 / VRF-Web Anycast Gateway</text>
    <text x="50" y="140" fill="#94A3B8" font-size="10">• Full-Mesh Uplink ke 4 Spine Switches</text>
    <text x="50" y="160" fill="#10B981" font-size="9.5" font-weight="bold">Latency: Exact 1-Hop ke Leaf Mana Pun</text>

    <rect x="585" y="55" width="515" height="145" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1.5"/>
    <text x="600" y="82" fill="#6EE7B7" font-size="12" font-weight="bold">Leaf 03 &amp; 04 (Rack B: App Tier)</text>
    <text x="600" y="104" fill="#F8FAFC" font-size="10.5">• 48x 25G SFP28 + 6x 100G Uplinks</text>
    <text x="600" y="122" fill="#38BDF8" font-size="10.5">• VTEP 10.10.200.2 / VRF-App Anycast Gateway</text>
    <text x="600" y="140" fill="#94A3B8" font-size="10">• Full-Mesh Uplink ke 4 Spine Switches</text>
    <text x="600" y="160" fill="#10B981" font-size="9.5" font-weight="bold">Latency: Exact 1-Hop ke Leaf Mana Pun</text>

    <rect x="1135" y="55" width="515" height="145" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1.5"/>
    <text x="1150" y="82" fill="#6EE7B7" font-size="12" font-weight="bold">Leaf 05 &amp; 06 (Rack C: Database Tier)</text>
    <text x="1150" y="104" fill="#F8FAFC" font-size="10.5">• 48x 25G SFP28 + 6x 100G Uplinks</text>
    <text x="1150" y="122" fill="#38BDF8" font-size="10.5">• VTEP 10.10.200.3 / VRF-DB Anycast Gateway</text>
    <text x="1150" y="140" fill="#94A3B8" font-size="10">• Strict Microsegmentation (Host ACLs)</text>
    <text x="1150" y="160" fill="#10B981" font-size="9.5" font-weight="bold">Latency: Exact 1-Hop ke Leaf Mana Pun</text>

    <rect x="1685" y="55" width="520" height="145" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1.5"/>
    <text x="1700" y="82" fill="#6EE7B7" font-size="12" font-weight="bold">Leaf 07 &amp; 08 (Rack D: NVMe Storage)</text>
    <text x="1700" y="104" fill="#F8FAFC" font-size="10.5">• 48x 25G/100G SFP28 NVMe-over-Fabrics</text>
    <text x="1700" y="122" fill="#38BDF8" font-size="10.5">• RoCEv2 (RDMA over Converged Ethernet)</text>
    <text x="1700" y="140" fill="#94A3B8" font-size="10">• Priority Flow Control (PFC) &amp; ECN Lossless</text>
    <text x="1700" y="160" fill="#10B981" font-size="9.5" font-weight="bold">Latency: Sub-microsecond Storage Access</text>
  </g>

  <!-- TIER 4: COMPUTE & STORAGE ENDPOINTS -->
  <g transform="translate(80, 850)" filter="url(#shadow)">
    <rect width="2240" height="230" rx="14" fill="#172033" stroke="#F59E0B" stroke-width="2"/>
    <rect width="2240" height="32" rx="14" fill="#1F293D"/>
    <text x="25" y="22" fill="#FDE68A" font-size="13" font-weight="bold">4. DATACENTER COMPUTE, VIRTUALIZATION &amp; STORAGE WORKLOADS</text>

    <rect x="35" y="55" width="515" height="145" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="50" y="82" fill="#FDE68A" font-size="12" font-weight="bold">Kubernetes &amp; Container Clusters</text>
    <text x="50" y="104" fill="#F8FAFC" font-size="10.5">• Dual-Homed 25G Active-Active LACP Bond</text>
    <text x="50" y="122" fill="#94A3B8" font-size="10">• Microservices, Ingress Pods, Web Frontends</text>
    <text x="50" y="140" fill="#94A3B8" font-size="10">• Subnet: 10.10.210.0/24 (VRF-Web)</text>
    <text x="50" y="160" fill="#F59E0B" font-size="9.5">Cilium eBPF Host-Level Microsegmentation</text>

    <rect x="585" y="55" width="515" height="145" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="600" y="82" fill="#FDE68A" font-size="12" font-weight="bold">Hypervisor Cluster (ESXi / Proxmox)</text>
    <text x="600" y="104" fill="#F8FAFC" font-size="10.5">• Dual-Homed 25G Active-Active LACP Bond</text>
    <text x="600" y="122" fill="#94A3B8" font-size="10">• Enterprise Application VMs &amp; Middleware</text>
    <text x="600" y="140" fill="#94A3B8" font-size="10">• Subnet: 10.10.220.0/24 (VRF-App)</text>
    <text x="600" y="160" fill="#F59E0B" font-size="9.5">VMware Distributed Switch / vMotion Zero Loss</text>

    <rect x="1135" y="55" width="515" height="145" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="1150" y="82" fill="#FDE68A" font-size="12" font-weight="bold">Database Enterprise Clusters</text>
    <text x="1150" y="104" fill="#F8FAFC" font-size="10.5">• Dual-Homed 25G Active-Active LACP Bond</text>
    <text x="1150" y="122" fill="#94A3B8" font-size="10">• Oracle RAC / PostgreSQL HA High-Throughput</text>
    <text x="1150" y="140" fill="#94A3B8" font-size="10">• Subnet: 10.10.230.0/24 (VRF-DB)</text>
    <text x="1150" y="160" fill="#F59E0B" font-size="9.5">Strict Zero-Trust ACL: Akses hanya dari App Tier</text>

    <rect x="1685" y="55" width="520" height="145" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="1700" y="82" fill="#FDE68A" font-size="12" font-weight="bold">All-Flash Enterprise SAN Storage</text>
    <text x="1700" y="104" fill="#F8FAFC" font-size="10.5">• Dual-Homed 100G NVMe-oF RoCEv2 Links</text>
    <text x="1700" y="122" fill="#94A3B8" font-size="10">• All-Flash NVMe Array Clusters</text>
    <text x="1700" y="140" fill="#94A3B8" font-size="10">• Ultra-High IOPS (Jutaan IOPS) / Low Jitter</text>
    <text x="1700" y="160" fill="#F59E0B" font-size="9.5">Lossless Priority Flow Control Data Transfer</text>
  </g>

  <!-- INTER-TIER FULL-MESH FABRIC CONNECTORS -->
  <line x1="290" y1="560" x2="292" y2="590" stroke="#818CF8" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <line x1="840" y1="560" x2="842" y2="590" stroke="#818CF8" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <line x1="1390" y1="560" x2="1392" y2="590" stroke="#818CF8" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <line x1="1940" y1="560" x2="1945" y2="590" stroke="#818CF8" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <!-- Leaf to Endpoint connectors -->
  <line x1="292" y1="820" x2="292" y2="850" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="842" y1="820" x2="842" y2="850" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1392" y1="820" x2="1392" y2="850" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1945" y1="820" x2="1945" y2="850" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- FOOTER LEGEND -->
  <g transform="translate(80, 1110)" filter="url(#shadow)">
    <rect width="2240" height="60" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="30" y="36" fill="#F8FAFC" font-size="12" font-weight="bold">STANDAR CLOS FABRIC SPINE-LEAF:</text>
    <text x="280" y="36" fill="#818CF8" font-size="11.5">1. Spine: Pure L3 Underlay Backbone (Tidak ada server colok langsung ke Spine)</text>
    <text x="920" y="36" fill="#D1FAE5" font-size="11.5">2. Leaf: VTEP &amp; Distributed Anycast Gateway (Setiap Leaf terhubung ke semua Spine)</text>
    <text x="1600" y="36" fill="#FCA5A5" font-size="11.5">3. Zero STP: BGP EVPN-VXLAN + ECMP Multipathing</text>
  </g>
</svg>